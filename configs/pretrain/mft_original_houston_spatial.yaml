# Houston — Original-MFT baseline, "Spatial" masking+loss pretraining (HSI+LiDAR)
#
# Same faithful original MFT encoder as mft_original_houston_mae.yaml (Conv3D+
# HetConv HSI front-end -> 121 spatial tokens, LiDAR-derived external CLS via
# channel tokenization, mCrossPA fusion), but pretrained with the team's
# "Spatial version" masking+loss instead of standard MAE: SimMIM-style in-place
# spatial token masking (75% of pixel tokens -> a learnable mask token), a 2-layer
# MLP decoder reconstructing the full 145-band HSI+LiDAR per-pixel vector, and a
# center-weighted MSE computed only on masked entries (recon_center_sigma=1.0).
# See pretrain/mft_spatial_mae.py — the encoded CLS is injected into each patch
# token before the decoder so the mCrossPA fusion receives a reconstruction
# gradient. Same training schedule + eval as the MAE variant, so the two ablations
# differ ONLY in the pretraining objective. Channel counts (144 HSI + 1 LiDAR) are
# auto-detected from the dataset class.
#
# Run with:
#   python scripts/pretrain_enhanced.py --config configs/pretrain/mft_original_houston_spatial.yaml

model:
  name: "mft_original"
  embed_dim: 64          # faithful MFT: dim = FM*4 (FM=16)
  num_heads: 8
  num_layers: 2          # depth
  mlp_dim: 512           # faithful MFT: fixed 512 (= dim*8 at dim=64)
  dropout: 0.1
  attention_type: "mcross"

  use_projection: false
  use_aux: true

data:
  patch_size: 11
  num_workers: 4

pretrain:
  datasets:
    - houston

  # "Spatial version" masking+loss (enhanced objective, spatial mask only).
  objective: "enhanced"

  # Training schedule (identical to mft_original_houston_mae.yaml).
  epochs: 3000
  batch_size: 64
  val_split: 0.0

  lr: 1.5e-4
  min_lr: 1.0e-6
  weight_decay: 0.05
  warmup_epochs: 100
  grad_clip: 1.0

  # --- Spatial masking + MLP decoder + center-weighted MSE ---
  band_mask_ratio: 0.0            # no per-(pixel,band) masking (ignored for MFT)
  spatial_mask_ratio: 0.75        # 75% of whole pixel tokens masked in place
  decoder_hidden_dim: 256
  recon_center_sigma: 1.0         # center-weighted reconstruction loss
  pool_center_sigma: 1.0          # informational; eval uses pool_sigma=null (CLS feature)

  save_interval: 50
  val_interval: 50000             # validation disabled (val_split 0)
  log_interval: 1
  use_amp: false

paths:
  data_root: "./data/raw"
  checkpoint_dir: "./checkpoints/pretrained/mft_original_houston_spatial"
  log_dir: "./logs/pretrain/mft_original_houston_spatial"

hardware:
  device: "cuda"
  seed: 42
  deterministic: true
