# Trento Level-2 MAE adaptation config for HyperSIGMA.
#
# Identical recipe to configs/hypersigma/houston_patchnative_joint_sem.yaml so
# results are directly comparable; only the dataset-specific fields
# differ (dataset name, band count, and the conventional PCA / checkpoint
# paths). See that file for the full explanation of `model.adapt_mode`
# and the masking scheme.
#
# Run with:
#   python scripts/adapt_hypersigma.py \
#       --config configs/hypersigma/trento_patchnative_joint_sem.yaml
#
# REPRODUCES  No published cell as written: this is the 3-band spatial front-end,
#             while Trento's Table 3 cells (`11x11 / joint+SEM` OA 87.19,
#             `11x11 / spatial` OA 86.02) were run at 100 bands — the joint+SEM
#             run added spat_resample_to: 100 and its own epochs/lr/batch, which
#             no committed config carries (experiments/
#             hypersigma_adapt_trento_pca100_joint_sem_run1 is the authority).
#             This file is the config BASE of
#             scripts/reproduce/run_hypersigma_spatial_pca100.py for the
#             spatial cell, which supplies the 100-band paths in code.
# RUNTIME     PAPER_CANON §3 times HyperSIGMA adaptation at ~36 h for 2000
#             epochs on one RTX 4090. This config runs 3000 epochs.

model:
  name: "hypersigma_dual"
  adapt_mode: "joint_sem"
  hsi_channels: 63          # Trento HSI bands (validated against the registry)
  spat_patch_k: 3
  embed_dim: 768
  num_tokens: 100
  dr_dim: 128
  num_stages: 4

data:
  dataset: "trento"
  data_root: "./data/raw"
  patch_size: 11
  num_workers: 4

paths:
  pca_spat_path: "checkpoints/hypersigma/pca_trento_3band.pkl"
  pca_stats_path: "checkpoints/hypersigma/pca_trento_3band_stats.pkl"
  spat_ckpt: "checkpoints/hypersigma/spat-vit-base.pth"
  spec_ckpt: "checkpoints/hypersigma/spec-vit-base.pth"
  checkpoint_dir: "checkpoints/hypersigma_adapted/trento_k3"
  log_dir: "logs/hypersigma_adapted/trento_k3"

pretrain:
  epochs: 3000
  batch_size: 64
  val_split: 0.01

  lr: 1.5e-4
  min_lr: 1.0e-6
  weight_decay: 0.05
  warmup_epochs: 100
  grad_clip: 1.0

  mask_ratio: 0.75
  spat_decoder_hidden: 256
  spec_decoder_hidden: 256
  fused_decoder_hidden: 512
  decoder_dropout: 0.0

  save_interval: 100
  checkpoint_milestones: [5, 10, 20, 50]
  val_interval: 50
  log_interval: 1
  use_amp: False

hardware:
  device: "cuda"
  seed: 42
  deterministic: False
