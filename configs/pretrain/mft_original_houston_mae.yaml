# Houston — Original-MFT baseline, standard-MAE pretraining (HSI+LiDAR)
#
# Faithful original MFT (Roy et al. 2023): Conv3D+HetConv HSI front-end producing
# 121 per-pixel spatial tokens, LiDAR-derived external CLS via channel
# tokenization, and mCrossPA fusion. Pretrained with the standard MAE recipe
# (He et al. 2022): remove 75% of the spatial tokens, encode the visible 25%
# (+ the LiDAR CLS) only, and a transformer decoder reconstructs the masked
# tokens' bands (norm_pix_loss). The decoder cross-attends to the encoded CLS so
# the mCrossPA transformer receives a reconstruction gradient (see
# pretrain/mft_mae.py). The transformer is the FAITHFUL MFT (Roy et al. 2023 /
# srinadh99): FM=16 -> dim=64, 8 heads, depth 2, mlp_dim 512 (a fixed 512, = dim*8).
# Channel counts (144 HSI + 1 LiDAR) are auto-detected from the dataset class.
#
# Run with:
#   python scripts/pretrain_enhanced.py --config configs/pretrain/mft_original_houston_mae.yaml

model:
  name: "mft_original"
  embed_dim: 64          # faithful MFT: dim = FM*4 (FM=16)
  num_heads: 8
  num_layers: 2          # depth
  mlp_dim: 512           # faithful MFT: fixed 512 (= dim*8 at dim=64)
  dropout: 0.1
  attention_type: "mcross"   # faithful MFT cross-patch attention (Q from CLS only)

  # Original MFT has no projection head (the MAE transformer decoder replaces it).
  use_projection: false
  # HSI+LiDAR: the LiDAR external CLS token is mandatory for MFT fusion.
  use_aux: true

data:
  patch_size: 11
  num_workers: 4

pretrain:
  datasets:
    - houston

  # Standard-MAE objective (token removal + transformer decoder).
  objective: "mae"

  # Training schedule (matches houston_pretrain_mae.yaml).
  epochs: 3000
  batch_size: 64
  val_split: 0.0

  lr: 1.5e-4
  min_lr: 1.0e-6
  weight_decay: 0.05
  warmup_epochs: 100
  grad_clip: 1.0

  # --- MAE masking & transformer decoder ---
  mask_ratio: 0.75
  decoder_dim: 64
  decoder_depth: 4
  decoder_heads: 4
  norm_pix_loss: true
  recon_center_sigma: null

  save_interval: 50
  val_interval: 50000             # validation disabled (val_split 0)
  log_interval: 1
  use_amp: false

paths:
  data_root: "./data/raw"
  checkpoint_dir: "./checkpoints/pretrained/mft_original_houston_mae"
  log_dir: "./logs/pretrain/mft_original_houston_mae"

hardware:
  device: "cuda"
  seed: 42
  deterministic: true
