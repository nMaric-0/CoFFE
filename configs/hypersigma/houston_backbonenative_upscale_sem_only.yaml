# Houston native-geometry MAE SEM-tuning config for HyperSIGMA.
#
# Ablation 2: keep BOTH encoders at their native pretrained geometry
# (SpatViT 64x64 / patch-8 / 100ch, SpecViT 64x64) so the pretrained
# patch_embed / spat_map / pos_embed LOAD from the checkpoint, upscale the
# 11x11 input to 64x64, and MAE-tune ONLY the fusion path on top of the
# frozen encoder (adapt_mode="sem_only"):
#   trained  = SEM + fused_decoder + spectral l1 + mask tokens
#   frozen   = both pretrained branch bodies + input projections + PCA
#   loss     = fused reconstruction only (SEM is geometry-agnostic; the
#              FPN-pooled spatial grid makes per-token spatial recon ill-posed,
#              so spatial/spectral per-token losses are not used here).
#
# Spatial 100-channel front-end: Houston (144 bands) uses PCA 144->100.
# Trento (63) / MUUFL (64) cannot reach 100 components via PCA, so they
# spectrally resample raw bands -> 100 on the fly: set
# paths.native_pca_spat_path to null (the dual then uses SpectralResample).
#
# Fit the 100-band PCA first (CPU, Houston only):
#   python scripts/fit_pca_hypersigma.py --dataset houston --n-components 100
# Then run:
#   python scripts/adapt_hypersigma.py \
#       --config configs/hypersigma/houston_backbonenative_upscale_sem_only.yaml
#
# Driven for all three datasets by notebooks/adapt_hypersigma_native_sem.ipynb.

model:
  name: "hypersigma_dual"
  adapt_mode: "sem_only"        # native-geometry SEM tuning (fusion path only)
  hsi_channels: 144
  spat_patch_k: 3               # ignored under native_geometry (uses patch-8); kept for API parity
  embed_dim: 768
  num_tokens: 100
  dr_dim: 128
  num_stages: 4
  # --- Native geometry knobs ---
  native_geometry: true
  input_fit: "upscale"          # "upscale" (interpolate 11->64) | "pad"
  pad_anchor: "center"
  interp_mode: "bicubic"

data:
  dataset: "houston"
  data_root: "./data/raw"
  patch_size: 11
  num_workers: 4

paths:
  # Spatial 100-band front-end. For Houston this is a fitted PCA 144->100.
  # For Trento/MUUFL set this to null so the dual spectrally resamples bands->100.
  native_pca_spat_path: "checkpoints/hypersigma/pca_houston_100band.pkl"
  # pca_spat_path / pca_stats_path are unused under native_geometry (the dual
  # uses native_pca_spat_path), but kept for clarity / non-native fallback.
  pca_spat_path: "checkpoints/hypersigma/pca_houston_100band.pkl"
  pca_stats_path: "checkpoints/hypersigma/pca_houston_100band_stats.pkl"
  spat_ckpt: "checkpoints/hypersigma/spat-vit-base.pth"
  spec_ckpt: "checkpoints/hypersigma/spec-vit-base.pth"
  checkpoint_dir: "checkpoints/hypersigma_adapted/houston_native_sem"
  log_dir: "logs/hypersigma_adapted/houston_native_sem"

pretrain:
  epochs: 3000
  batch_size: 64
  val_split: 0.01

  lr: 1.5e-4
  min_lr: 1.0e-6
  weight_decay: 0.05
  warmup_epochs: 100
  grad_clip: 1.0

  mask_ratio: 0.75
  spat_decoder_hidden: 256
  spec_decoder_hidden: 256
  fused_decoder_hidden: 512
  decoder_dropout: 0.0

  save_interval: 100
  checkpoint_milestones: [5, 10, 20, 50]
  val_interval: 50
  log_interval: 1
  use_amp: False

hardware:
  device: "cuda"
  seed: 42
  deterministic: False
