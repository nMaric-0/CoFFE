# CoFFE MAE — Muufl, HSI+LiDAR
#
# Reproduces the paper's Table 2 cell **OA 65.33**.
#
#   source run       experiments/muufl_mae_lidar/
#   evaluated at     epoch 975 of a 1500-epoch schedule
#
# Every recipe value below matches that run's frozen pretrain_config.yaml,
# checked by tools/refactor/make_cell_configs.py.
#
# NOTE this file keeps its original `paths:` (config paths are on the
# audit's DO-NOT-RENAME list). Those directories do not exist today — the
# paper's checkpoints are under experiments/<run>/checkpoints/ — but a
# plain `python scripts/pretrain.py --config ...` will create and write
# into them. Point `paths:` elsewhere if that matters to you.
#
# NOTE the checkpoint the paper evaluated is NOT the final one: train the
# full 1500 epochs, then evaluate epoch 975
# (PAPER_CANON §8 D17).
#
# Run with:
#   python scripts/pretrain.py --config configs/coffe/muufl_mae.yaml

# MUUFL MAE Pretraining Configuration (original MAE recipe, HSI+LiDAR tokens)
#
# MAE recipe (He et al. 2022): remove 75% of the spatial (pixel) tokens, encode
# only the visible 25% (+ the CLS token), and let a transformer decoder
# reconstruct the masked tokens. No per-(pixel,band) Bernoulli masking; the MLP
# projection head is removed (use_projection=false). Channel counts (64 HSI +
# 2 LiDAR) are auto-detected from the dataset class. Same training recipe as
# muufl_simmim.yaml so the result is directly comparable.
#
# Run with:
#   python scripts/pretrain.py --config configs/coffe/muufl_mae.yaml

# Model architecture
model:
  name: "coffe"
  embed_dim: 128
  num_heads: 2
  num_layers: 2
  lambda_factor: 0.5
  dropout: 0.1

  # MAE removes the projection head. Kept (but inert) for eval auto-load.
  use_projection: false
  proj_hidden_dim: 512
  proj_num_layers: 1
  proj_l2_normalize: true

  # HSI+LiDAR: the 2 LiDAR bands ARE concatenated.
  use_aux: true

# Data settings
data:
  patch_size: 11
  num_workers: 4
  # MUUFL-specific (2 LiDAR bands; informational, read from dataset class)
  hsi_channels: 64
  aux_channels: 2

# Pretraining settings
pretrain:
  # Single dataset
  datasets:
    - muufl

  # Select the original-MAE objective (transformer decoder, token removal).
  objective: "mae"

  # Training schedule (identical to muufl_simmim.yaml)
  epochs: 1500
  batch_size: 64
  val_split: 0.0

  # Optimizer (MAE settings)
  lr: 1.5e-4
  min_lr: 1.0e-6
  weight_decay: 0.05
  warmup_epochs: 100
  grad_clip: 1.0

  # --- MAE masking & transformer decoder ---
  mask_ratio: 0.75
  decoder_dim: 64
  decoder_depth: 4
  decoder_heads: 4
  norm_pix_loss: true

  band_mask_ratio: 0.0
  spatial_mask_ratio: 0.0

  recon_center_sigma: null
  pool_center_sigma: 1.0

  # Checkpointing
  save_interval: 25
  val_interval: 3000
  log_interval: 1
  use_amp: false

# Paths - unique for MAE MUUFL pretraining
paths:
  data_root: "./data/raw"
  checkpoint_dir: "./checkpoints/pretrained/muufl_mae"
  log_dir: "./logs/pretrain/muufl_mae"

hardware:
  device: "cuda"
  seed: 42
  deterministic: true
