# MUUFL MAE HSI-only Pretraining Configuration (original MAE recipe, no LiDAR)
#
# HSI-only ablation of the MAE variant: model.use_aux=false drops the 2 LiDAR/aux
# bands entirely, so one token per pixel carries the 64 HSI bands alone. The MAE
# recipe is otherwise identical to muufl_mae.yaml. Controlled
# HSI-only-vs-HSI+LiDAR comparison.
#
# Run with:
#   python scripts/pretrain.py --config configs/coffe/muufl_mae_hsi.yaml

# Model architecture
model:
  name: "coffe"
  embed_dim: 128
  num_heads: 2
  num_layers: 2
  lambda_factor: 0.5
  dropout: 0.1

  # HSI-only: ignore aux/LiDAR bands entirely.
  use_aux: false

  # MAE removes the projection head. Kept (but inert) for eval auto-load.
  use_projection: false
  proj_hidden_dim: 512
  proj_num_layers: 1
  proj_l2_normalize: true

# Data settings
data:
  patch_size: 11
  num_workers: 4
  # MUUFL-specific (informational; actual values read from dataset class)
  hsi_channels: 64
  aux_channels: 2

# Pretraining settings
pretrain:
  # Single dataset
  datasets:
    - muufl

  # Select the original-MAE objective (transformer decoder, token removal).
  objective: "mae"

  # Training schedule (identical to muufl_simmim.yaml)
  epochs: 1500
  batch_size: 64
  val_split: 0.0

  # Optimizer (MAE settings)
  lr: 1.5e-4
  min_lr: 1.0e-6
  weight_decay: 0.05
  warmup_epochs: 100
  grad_clip: 1.0

  # --- MAE masking & transformer decoder ---
  mask_ratio: 0.75
  decoder_dim: 64
  decoder_depth: 4
  decoder_heads: 4
  norm_pix_loss: true

  band_mask_ratio: 0.0
  spatial_mask_ratio: 0.0

  recon_center_sigma: null
  pool_center_sigma: 1.0

  # Checkpointing
  save_interval: 25
  val_interval: 3000
  log_interval: 1
  use_amp: false

# Paths - unique for HSI-only MAE MUUFL pretraining
paths:
  data_root: "./data/raw"
  checkpoint_dir: "./checkpoints/pretrained/muufl_mae_hsi_only"
  log_dir: "./logs/pretrain/muufl_mae_hsi_only"

hardware:
  device: "cuda"
  seed: 42
  deterministic: true
