# Enhanced MUUFL Pretraining Configuration (unified HSI+LiDAR tokens)
#
# LiDAR (2 elevation/intensity bands) is concatenated as extra bands on each
# pixel, so one token per pixel carries all 64 HSI bands + 2 LiDAR bands
# (66 total). Two masking regimes are supported and can be combined (set either
# ratio to 0 to disable):
#   - band_mask_ratio: per-(pixel, band) Bernoulli mask on the raw input.
#   - spatial_mask_ratio: MAE-style masking of whole pixel tokens.
# The decoder reconstructs the full 66-value per-pixel vector; loss is MSE over
# the masked entries (union of both masks when both are enabled).
#
# Mirrors the re-tuned Trento recipe (Houston-proven: 2 heads / 2 layers,
# lambda 0.5, band-only masking, AMP off, deterministic).
#
# Run with:
#   python scripts/pretrain_enhanced.py --config configs/pretrain/muufl_pretrain_enhanced.yaml

# Model architecture
model:
  name: "mft_cpea"
  embed_dim: 128
  num_heads: 2
  num_layers: 2
  lambda_factor: 0.5
  dropout: 0.1

  # Projection head (trained for few-shot transfer)
  use_projection: true
  proj_hidden_dim: 512
  proj_num_layers: 1
  proj_l2_normalize: true

# Data settings
data:
  patch_size: 11
  num_workers: 4
  # MUUFL-specific (2 LiDAR bands)
  hsi_channels: 64
  aux_channels: 2

# Enhanced pretraining settings
pretrain:
  # Single dataset
  datasets:
    - muufl

  # Training schedule
  epochs: 1500
  batch_size: 64
  val_split: 0.0

  # Optimizer (MAE settings)
  lr: 1.5e-4
  min_lr: 1.0e-6
  weight_decay: 0.05
  warmup_epochs: 100
  grad_clip: 1.0

  # Decoder
  decoder_hidden_dim: 256

  # Band-only masking, matching the proven Houston regime.
  band_mask_ratio: 0.9
  spatial_mask_ratio: 0.0

  # Center-weighted reconstruction loss (Gaussian sigma).
  recon_center_sigma: 1.0

  # Center-weighted prototype pooling (Gaussian sigma, used at evaluation).
  pool_center_sigma: 1.0

  # Checkpointing
  save_interval: 25
  val_interval: 3000
  log_interval: 1
  use_amp: false

# Paths - unique for enhanced MUUFL pretraining
paths:
  data_root: "./data/raw"
  checkpoint_dir: "./checkpoints/pretrained/muufl_enhanced"
  log_dir: "./logs/pretrain/muufl_enhanced"

hardware:
  device: "cuda"
  seed: 42
  deterministic: true
