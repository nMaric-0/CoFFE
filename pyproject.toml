[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=models --cov=data --cov-report=term-missing"
markers = [
    "equivalence: behaviour-equivalence harness (tests/equivalence); must stay green on every refactor commit",
    "gpu: requires a CUDA device",
    "data: requires the real datasets under data/raw/",
    "slow: takes more than a few seconds",
]
