# Placeholder — values mirror configs/pretrain/houston_pretrain_enhanced.yaml
# but this is not a real run.
hardware:
  device: cuda
  seed: 42
  deterministic: false
paths:
  data_root: ./data/raw
data:
  patch_size: 11
  num_workers: 4
model:
  embed_dim: 128
  num_heads: 2
  num_layers: 2
  lambda_factor: 0.5
  dropout: 0.1
  use_projection: true
pretrain:
  datasets: [houston]
  epochs: 10000
  batch_size: 64
  lr: 1.5e-4
  band_mask_ratio: 0.9
  spatial_mask_ratio: 0.0
  val_split: 0.1
